<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSN Pokémon Draft — Live Draft Board</title>
<!-- CACHE_BUST: whenever app.js, style.css, or firebase-sync.js changes,
     bump the version in ALL THREE of these places together:
       1. The ?v= query string on every script/link tag below
       2. The <meta name="app-version"> tag just below
       3. version.json at the repo root
     GitHub Pages caches every file — including this HTML — for 10
     minutes (cache-control: max-age=600), and browsers cache
     independently on top of that. A normal reload can be served
     entirely from local cache with zero network request during that
     window, so a fresh push can silently stay invisible for a while.
     The inline script below checks version.json (fetched with
     cache-busting so it always reaches the real server) on every load
     and force-refreshes if this page turns out to be stale. -->
<meta name="app-version" content="1">
<link rel="stylesheet" href="style.css?v=1">
<script>
// Runs before anything else. Even a stale cached copy of this very page
// keeps running this same check (it doesn't need to change between
// deploys), so once it's live, staleness gets caught within about a
// second of loading instead of only after something visibly breaks.
(function () {
  var CURRENT_VERSION = document.querySelector('meta[name="app-version"]').content;
  fetch("version.json?_=" + Date.now(), { cache: "no-store" })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (data) {
      if (!data || data.version === CURRENT_VERSION) return;
      var url = new URL(location.href);
      url.searchParams.set("_recover", Date.now().toString());
      location.replace(url.toString());
    })
    .catch(function () {
      // A network hiccup here shouldn't block the page from loading —
      // worst case this particular load just doesn't get to self-check.
    });
})();
</script>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <div>
      <div class="eyebrow">NSN Pokémon Draft League</div>
      <h1>Live Draft Board</h1>
      <p>Pick order is preset below. Everyone sees updates in real time.</p>
    </div>
    <div class="identity">
      <label for="teamSelect">You are drafting for</label>
      <select id="teamSelect"></select>
    </div>
  </div>

  <div class="last-pick-bar" id="lastPickBar"></div>
  <div class="mock-bar" id="mockBar"></div>
  <div class="status-bar" id="turnStatus"></div>
  <div class="finalize-bar" id="finalizeBar"></div>

  <div class="layout">
    <div class="board" id="board"></div>

    <div class="pool-panel">
      <div class="pool-head">
        <input id="search" type="text" placeholder="Search available Pokémon…">
        <span id="poolCount" class="pool-count"></span>
      </div>
      <label class="suggest-toggle">
        <input type="checkbox" id="suggestToggle">
        Suggest picks based on past drafts
      </label>
      <div class="suggestions" id="suggestions"></div>
      <div class="pool" id="pool"></div>
    </div>
  </div>

  <div class="predictions" id="predictions"></div>

  <footer>Click a Pokémon to draft it — only enabled when it's your team's turn and you can afford it.</footer>
</div>

<script src="config.js?v=1"></script>
<script src="pokemon-data.js?v=1"></script>
<script type="module" src="app.js?v=1"></script>
</body>
</html>
